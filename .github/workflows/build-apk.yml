name: Construir APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear plataforma Android
        run: npx cap add android

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Compilar APK de depuración
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TeoriaDelBajo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
