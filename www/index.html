<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1033">
  <title>Teoría Musical para Bajistas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="topbar">
    <button id="menu-toggle" aria-label="Menú">☰</button>
    <span class="brand">🎸 Teoría del Bajo</span>
  </header>

  <nav id="nav"></nav>

  <main id="main"></main>

  <footer id="footer">Todo el contenido está dentro de la app · funciona sin internet</footer>

  <script src="js/theory.js"></script>
  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('menu-toggle').addEventListener('click', ()=>{
      document.getElementById('nav').classList.toggle('open');
    });
    document.getElementById('nav').addEventListener('click', e=>{
      if(e.target.classList.contains('navbtn')) document.getElementById('nav').classList.remove('open');
    });
  </script>
</body>
</html>
